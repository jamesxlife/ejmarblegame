<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EJ's Football Marble Cup - 23 football teams race through five obstacle zones.">
  <title>EJ's Football Marble Cup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <header class="hero">
    <div><div class="kicker">PREMIER LEAGUE + WELSH CLUBS</div><h1>⚽ EJ's Football Marble Cup</h1><p>23 teams • 5 obstacle zones • first marble home wins</p></div>
    <div class="controls"><button id="play">▶ PLAY</button><button id="jolt" disabled>⚡ JOLT</button></div>
  </header>
  <section class="layout">
    <div class="board"><canvas id="game" width="900" height="1240" aria-label="Football marble race course"></canvas></div>
    <aside class="leaderboard">
      <div class="leader-head"><div><div class="live">LIVE RESULTS</div><h2>🏆 Leaderboard</h2></div><span id="timer"></span></div>
      <div id="results"><p class="hint">Click <b>PLAY</b> to launch every marble at once. Positions will appear here as each team crosses the line.</p></div>
      <button id="again" class="again" hidden>RACE AGAIN ↻</button>
    </aside>
  </section>
</main>
<script src="game.js"></script>
</body>
</html>
